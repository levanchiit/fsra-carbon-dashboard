steps:
  # Build and deploy directly to Cloud Run using Google Cloud Buildpacks
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fsra-carbon-dashboard'
      - '--source=.'
      - '--region=asia-southeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY